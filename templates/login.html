{% extends "base.html" %}
{% block title %}Log in — K&amp;K Auctions{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Log in</h1>
  <form method="post">
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-brand btn-lg" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
